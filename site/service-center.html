<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>服務中心｜Passium</title>
<style>
:root{
  --bg:#f4f5f9;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:rgba(17,24,39,.08);
  --shadow:0 8px 24px rgba(0,0,0,.06);
  --ok:#16a34a;
  --ok-bg:#dcfce7;
  --warn:#dc2626;
  --warn-bg:#fee2e2;
  --blue:#2563eb;
  --blue-bg:#dbeafe;
  --yellow:#d97706;
  --yellow-bg:#fef3c7;
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);}
.wrap{max-width:1060px;margin:auto;padding:20px 16px 60px;}

/* ── Cards ── */
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--line);}
.card-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.card-title{font-size:16px;font-weight:900;margin:0;}
.divider{height:1px;background:var(--line);margin:14px 0;}

/* ── Typography ── */
h1{margin:0;font-size:22px;font-weight:900;}
.sub{color:var(--muted);font-size:13px;line-height:1.7;margin-top:4px;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
.small{font-size:12px;color:var(--muted);}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .12s;}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:#111827;color:#fff;}
.btn-secondary{background:#fff;color:#111827;border:1px solid #ddd;}
.btn-ok{background:var(--ok);color:#fff;}
.btn-danger{background:var(--warn);color:#fff;}
.btn-yellow{background:var(--yellow);color:#fff;}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:10px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* ── Badges / Pills ── */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:900;}
.badge-ok{background:var(--ok-bg);color:var(--ok);}
.badge-warn{background:var(--warn-bg);color:var(--warn);}
.badge-blue{background:var(--blue-bg);color:var(--blue);}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow);}
.badge-gray{background:#f3f4f6;color:#374151;}

/* ── Top bar ── */
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.topbar-inner{max-width:1060px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;}
.topbar-event{font-size:13px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:780px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.stat-num{font-size:28px;font-weight:900;line-height:1;}
.stat-num.ok{color:var(--ok);}
.stat-num.warn{color:var(--warn);}
.stat-num.blue{color:var(--blue);}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px;}

/* ── Search ── */
.search-wrap{display:flex;gap:8px;align-items:center;}
.search-input{flex:1;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;outline:none;background:#fff;transition:border-color .15s;}
.search-input:focus{border-color:#111827;}
.search-results{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.result-item{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .12s,background .12s;}
.result-item:hover{border-color:#111827;background:#fafafa;}
.result-item.active{border-color:#111827;background:#f9fafb;}
.result-name{font-weight:700;font-size:14px;}
.result-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* ── Ticket detail ── */
.ticket-detail{display:grid;grid-template-columns:1fr 1fr;gap:0;}
@media(max-width:620px){.ticket-detail{grid-template-columns:1fr;}}
.ticket-kv{padding:10px 0;border-bottom:1px solid var(--line);}
.ticket-kv:last-child{border-bottom:none;}
.ticket-kv .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.ticket-kv .v{font-size:14px;font-weight:700;margin-top:3px;}
.ticket-highlight{font-size:20px !important;color:var(--blue) !important;}
.ticket-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}

/* ── Log list ── */
.log-list{display:flex;flex-direction:column;gap:0;}
.log-item{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;}
.log-item:last-child{border-bottom:none;}
.log-action{font-size:11px;font-weight:900;padding:2px 8px;border-radius:6px;white-space:nowrap;}
.log-info{font-size:12px;line-height:1.6;}
.log-time{font-size:11px;color:var(--muted);white-space:nowrap;}

/* ── Schedule ── */
.schedule-item{padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .12s;}
.schedule-item:hover{border-color:#999;}
.schedule-item.current{border-color:#111827;background:#fafafa;}
.schedule-main{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.schedule-sub{font-size:12px;color:var(--muted);margin-top:4px;}

/* ── Login ── */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;}
.login-box{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.1);}
.login-logo{text-align:center;font-size:32px;margin-bottom:4px;}
.login-title{text-align:center;font-size:20px;font-weight:900;margin-bottom:4px;}
.login-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;outline:none;transition:border-color .15s;}
.field input:focus{border-color:#111827;}
.login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#111827;color:#fff;font-size:15px;font-weight:900;cursor:pointer;margin-top:6px;}
.login-err{color:var(--warn);font-size:13px;margin-top:10px;text-align:center;display:none;}
.empty{color:var(--muted);font-size:13px;padding:16px 0;}

/* ── Two-col layout ── */
.layout2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:780px){.layout2{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- Login -->
<div id="loginWrap">
  <div class="login-box">
    <div class="login-logo">🎫</div>
    <div class="login-title">服務中心</div>

      <div class="topbar-left">
        <div class="topbar-logo">🎫 服務中心</div>

      </div>
      <div class="row">

  <div class="wrap">

        <div class="row">
          <span class="badge badge-gray" id="eventStatusBadge">–</span>
          <span class="badge badge-gray" id="gateNameBadge">–</span>

            <button class="btn btn-primary" id="searchBtn">查詢</button>

      <!-- 右：今日活動 + 服務紀錄 -->
      <div>

<script>
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey:"AIzaSyDtF2pHo84vy2n_dJAkCisopllaLAWjaj0",
    authDomain:"concert-1ff7e.firebaseapp.com",
    projectId:"concert-1ff7e",
    storageBucket:"concert-1ff7e.firebasestorage.app",
    messagingSenderId:"704757384914",
    appId:"1:704757384914:web:9f58e4085dd71180c5cf0b"
  });
}
const auth = firebase.auth();
const db   = firebase.firestore();

const esc  = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const norm = s => String(s ?? "").trim();

// ── State ──
let currentUser = null;
let currentSelectedAssignment = null;
let currentEventData = null;
let currentTicket = null;
let ticketsCache = [];
let unsubStats = null;
let unsubLogs = null;
let unsubScanLogs = null;

// ── Elements ──
const loginWrap   = document.getElementById("loginWrap");
const appWrap     = document.getElementById("appWrap");
const loginEmail  = document.getElementById("loginEmail");
const loginPw     = document.getElementById("loginPassword");
const loginBtn    = document.getElementById("loginBtn");
const loginErr    = document.getElementById("loginErr");
const logoutBtn   = document.getElementById("logoutBtn");
const queryEl     = document.getElementById("queryEl");
const searchBtn   = document.getElementById("searchBtn");
const clearBtn    = document.getElementById("clearBtn");
const searchStatus = document.getElementById("searchStatus");
const searchResults = document.getElementById("searchResults");
const ticketDetailCard = document.getElementById("ticketDetailCard");
const ticketDetailBody = document.getElementById("ticketDetailBody");
const closeDetailBtn = document.getElementById("closeDetailBtn");
const scheduleListEl  = document.getElementById("scheduleListEl");
const serviceLogsDiv  = document.getElementById("serviceLogsDiv");
const logCount    = document.getElementById("logCount");

// ── Helpers ──
function toMillis(ts){
  if (!ts) return 0;
  if (ts.toDate) return ts.toDate().getTime();
  if (ts instanceof Date) return ts.getTime();
  return new Date(ts).getTime();
}

function fmtTime(ts){
  if (!ts) return "–";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return isNaN(d) ? "–" : d.toLocaleString("zh-TW", { timeZone:"Asia/Taipei" });
}

function fmtOnlyTime(ts){
  if (!ts) return "–";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return isNaN(d) ? "–" : d.toLocaleTimeString("zh-TW", { hour:"2-digit", minute:"2-digit", timeZone:"Asia/Taipei" });
}

function isTodayTs(ts){
  if (!ts) return false;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

function getEventTimeState(eventData){
  if (!eventData?.eventStartAt || !eventData?.eventEndAt) return { state:"invalid", ok:false, reason:"活動時間未設定" };
  const now = Date.now();
  const s = toMillis(eventData.eventStartAt);
  const e = toMillis(eventData.eventEndAt);
  if (now < s) return { state:"upcoming", ok:false, reason:"活動尚未開始" };
  if (now > e) return { state:"ended", ok:false, reason:"活動已結束，目前不可操作" };
  return { state:"active", ok:true };
}

function statusText(s){
  const m = { valid:"有效", invalid:"無效", inside:"在場中", exited:"已出場", not_entered:"未入場", used:"已使用", cancelled:"已取消" };
  return m[s] || s || "–";
}

function checkedInText(t){
  if (t.checkedIn === true || norm(t.checkinStatus).toLowerCase() === "checked_in") return "已入場";
  return "未入場";
}

function getTicketStatusBadge(t){
  const s = norm(t.status || "");
  const ci = t.checkedIn === true || norm(t.checkinStatus).toLowerCase() === "checked_in";
  if (s === "inside") return `<span class="badge badge-ok">在場中</span>`;
  if (s === "exited") return `<span class="badge badge-blue">已出場</span>`;
  if (ci) return `<span class="badge badge-ok">已入場</span>`;
  if (s === "valid" || s === "") return `<span class="badge badge-yellow">未入場</span>`;
  if (s === "invalid" || s === "cancelled") return `<span class="badge badge-warn">無效</span>`;
  return `<span class="badge badge-gray">${esc(statusText(s))}</span>`;
}

// ── Login ──
loginBtn.onclick = doLogin;
loginPw.onkeydown = e => { if (e.key === "Enter") doLogin(); };
logoutBtn.onclick = () => auth.signOut();

async function doLogin(){
  const email = norm(loginEmail.value);
  const pw = loginPw.value;
  loginErr.style.display = "none";
  if (!email || !pw) { loginErr.textContent = "請輸入帳號與密碼"; loginErr.style.display = "block"; return; }
  loginBtn.disabled = true; loginBtn.textContent = "登入中…";
  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){
    loginErr.textContent = "帳號或密碼錯誤，請再試一次";
    loginErr.style.display = "block";
    loginBtn.disabled = false; loginBtn.textContent = "登入";
  }
}

// ── Auth ──
auth.onAuthStateChanged(async user => {
  currentUser = user || null;
  if (!user) {
    loginWrap.style.display = "flex";
    appWrap.style.display = "none";
    loginBtn.disabled = false; loginBtn.textContent = "登入";
    return;
  }
  loginWrap.style.display = "none";
  appWrap.style.display = "block";
  document.getElementById("topbarWho").textContent = user.email;
  await initApp();
});

async function initApp(){
  const assignments = await getMyServiceAssignments(currentUser.uid);
  currentSelectedAssignment = pickBestAssignment(assignments);
  renderCurrentAssignmentInfo();
  renderSchedule(assignments);
  watchStats();
  watchServiceLogs();
  watchScanLogs();
}

// ── Assignments ──
async function getMyServiceAssignments(uid){
  const eventsSnap = await db.collection("events").get();
  const rows = [];
  for (const eventDoc of eventsSnap.docs) {
    const eventId = eventDoc.id;
    const eventData = eventDoc.data() || {};
    try{
      const staffDoc = await db.doc(`events/${eventId}/staffAssignments/${uid}`).get();
      if (!staffDoc.exists) continue;
      const a = staffDoc.data() || {};
      const canService = a?.permissions?.canService === true || norm(a.roleInEvent) === "service_center" || norm(a.roleInEvent) === "manager";
      if (!canService) continue;
      rows.push({ eventId, eventData, ...a });
    }catch(_){}
  }
  return rows;
}

function pickBestAssignment(assignments){
  if (!assignments.length) return null;
  const todayOnly = assignments.filter(a => isTodayTs(a.eventData?.eventStartAt));
  const rows = (todayOnly.length ? todayOnly : assignments.slice()).sort((a,b) => toMillis(a.eventData?.eventStartAt) - toMillis(b.eventData?.eventStartAt));
  return rows.find(a => getEventTimeState(a.eventData).state === "active") || rows.find(a => getEventTimeState(a.eventData).state === "upcoming") || rows[rows.length-1];
}

function renderCurrentAssignmentInfo(){
  currentEventData = currentSelectedAssignment?.eventData || null;
  if (!currentSelectedAssignment) {
    document.getElementById("currentEventTitle").textContent = "沒有可用活動";
    document.getElementById("currentEventSub").textContent = "你尚未被指派服務中心身份";
    document.getElementById("eventStatusBadge").textContent = "–";
    document.getElementById("topbarEvent").textContent = "–";
    return;
  }
  const ev = currentEventData;
  document.getElementById("currentEventTitle").textContent = norm(ev?.title || currentSelectedAssignment.eventId || "未命名");
  document.getElementById("topbarEvent").textContent = norm(ev?.title || "");
  document.getElementById("currentEventSub").textContent = `${fmtTime(ev?.eventStartAt)} ～ ${fmtTime(ev?.eventEndAt)}`;
  document.getElementById("gateNameBadge").textContent = `入口：${norm(currentSelectedAssignment.gateName || "未指定")}`;
  document.getElementById("roleBadge").textContent = `身份：${norm(currentSelectedAssignment.roleInEvent || "–")}`;

  const ts = getEventTimeState(ev);
  const badge = document.getElementById("eventStatusBadge");
  if (ts.state === "active")    { badge.className = "badge badge-ok";     badge.textContent = "目前可操作"; }
  else if (ts.state === "upcoming") { badge.className = "badge badge-blue";  badge.textContent = "尚未開始"; }
  else if (ts.state === "ended")    { badge.className = "badge badge-warn";  badge.textContent = "已結束"; }
  else                          { badge.className = "badge badge-gray";   badge.textContent = "時間未設定"; }
}

function renderSchedule(assignments){
  if (!assignments.length) {
    scheduleListEl.innerHTML = `<div class="empty">今天沒有可操作的服務中心活動</div>`;
    return;
  }
  const todayOnly = assignments.filter(a => isTodayTs(a.eventData?.eventStartAt));
  const rows = (todayOnly.length ? todayOnly : assignments.slice()).sort((a,b) => toMillis(a.eventData?.eventStartAt) - toMillis(b.eventData?.eventStartAt));

  scheduleListEl.innerHTML = rows.map(a => {
    const ts = getEventTimeState(a.eventData);
    const isCurrent = currentSelectedAssignment?.eventId === a.eventId;
    let badgeCls = "badge-gray", badgeText = "–";
    if (ts.state === "active")    { badgeCls = "badge-ok";    badgeText = "目前可操作"; }
    if (ts.state === "upcoming")  { badgeCls = "badge-blue";  badgeText = "尚未開始"; }
    if (ts.state === "ended")     { badgeCls = "badge-warn";  badgeText = "已結束"; }

    return `<div class="schedule-item ${isCurrent ? "current" : ""}" onclick="switchAssignment('${esc(a.eventId)}')">
      <div class="schedule-main">${esc(a.eventData?.title || a.eventId)} <span class="badge ${badgeCls}">${badgeText}</span></div>
      <div class="schedule-sub">${esc(fmtOnlyTime(a.eventData?.eventStartAt))} – ${esc(fmtOnlyTime(a.eventData?.eventEndAt))} ｜ 入口：${esc(a.gateName || "未指定")} ｜ 身份：${esc(a.roleInEvent || "–")}</div>
    </div>`;
  }).join("");
}

window.switchAssignment = function(eventId){
  // handled by reload
};

// ── Stats ──
function watchStats(){
  if (unsubStats) { unsubStats(); unsubStats = null; }
  if (!currentSelectedAssignment) return;
  unsubStats = db.collection(`events/${currentSelectedAssignment.eventId}/tickets`).onSnapshot(snap => {
    let total=0, inside=0, exited=0, notEntered=0;
    snap.forEach(doc => {
      total++;
      const s = norm(doc.data().status || "");
      const ci = doc.data().checkedIn === true || norm(doc.data().checkinStatus).toLowerCase() === "checked_in";
      if (s === "inside") inside++;
      else if (s === "exited") exited++;
      else if (ci) inside++;
      else notEntered++;
    });
    document.getElementById("sTotal").textContent = total;
    document.getElementById("sInside").textContent = inside;
    document.getElementById("sExited").textContent = exited;
    document.getElementById("sNotEntered").textContent = notEntered;
  }, err => console.warn("stats error:", err));
}

// ── Service Logs ──
function watchServiceLogs(){
  if (unsubLogs) { unsubLogs(); unsubLogs = null; }
  if (!currentSelectedAssignment) return;

  const actionLabels = {
    force_checkin:  ["badge-ok",    "強制入場"],
    force_checkout: ["badge-blue",  "強制出場"],
    reset_ticket:   ["badge-yellow","重設狀態"]
  };

  unsubLogs = db.collection(`events/${currentSelectedAssignment.eventId}/serviceLogs`)
    .orderBy("createdAt","desc").limit(30)
    .onSnapshot(snap => {
      logCount.textContent = `共 ${snap.size} 筆`;
      if (snap.empty) { serviceLogsDiv.innerHTML = `<div class="empty">目前沒有操作紀錄</div>`; return; }
      serviceLogsDiv.innerHTML = snap.docs.map(doc => {
        const d = doc.data() || {};
        const [cls, label] = actionLabels[d.action] || ["badge-gray", d.action || "–"];
        const time = fmtTime(d.createdAt);
        return `<div class="log-item">
          <span class="log-action badge ${cls}">${esc(label)}</span>
          <div class="log-info">
            <b>${esc(d.name || "–")}</b><br>
            <span class="small">${esc(d.email || "–")}</span><br>
            <span class="small mono">${esc(d.ticketId || d.ticketDocId || "–")}</span>
          </div>
          <div class="log-time">${esc(time)}</div>
        </div>`;
      }).join("");
    }, err => console.warn("logs error:", err));
}

// ── Search ──
searchBtn.onclick = searchTickets;
queryEl.onkeydown = e => { if (e.key === "Enter") searchTickets(); };
clearBtn.onclick = clearSearch;
closeDetailBtn.onclick = () => { ticketDetailCard.style.display = "none"; currentTicket = null; };

async function searchTickets(){
  const q = norm(queryEl.value);
  if (!q) { searchStatus.textContent = "請輸入查詢內容"; return; }
  if (!currentSelectedAssignment) { alert("目前沒有可操作的活動"); return; }

  searchStatus.textContent = "查詢中…";
  searchResults.innerHTML = "";
  ticketDetailCard.style.display = "none";
  ticketsCache = [];

  try{
    const eventId = currentSelectedAssignment.eventId;
    const queries = [
      db.collection(`events/${eventId}/tickets`).where("ticketId","==",q).get(),
      db.collection(`events/${eventId}/tickets`).where("email","==",q.toLowerCase()).get(),
      db.collection(`events/${eventId}/tickets`).where("holderName","==",q).get(),
      db.collection(`events/${eventId}/tickets`).where("studentId","==",q).get(),
    ];

    let ticketByDocId = null;
    try { const s = await db.doc(`events/${eventId}/tickets/${q}`).get(); if (s.exists) ticketByDocId = { id:s.id, ...s.data() }; } catch(_){}

    const snaps = await Promise.all(queries);
    const map = new Map();
    if (ticketByDocId) map.set(ticketByDocId.id, ticketByDocId);
    snaps.forEach(snap => snap.forEach(doc => { if (!map.has(doc.id)) map.set(doc.id, { id:doc.id, ...doc.data() }); }));

    ticketsCache = [...map.values()];
    searchStatus.textContent = `找到 ${ticketsCache.length} 張票券`;

    if (!ticketsCache.length) {
      searchResults.innerHTML = `<div class="empty">找不到符合的票券</div>`;
      return;
    }

    searchResults.innerHTML = ticketsCache.map(t => `
      <div class="result-item" onclick="selectTicket('${esc(t.id)}')">
        <div class="result-name">${esc(t.holderName || t.name || "–")} ${getTicketStatusBadge(t)}</div>
        <div class="result-sub">${esc(t.holderEmail || t.email || "–")} ｜ ${esc(t.ticketTypeName || "–")} ｜ ${esc(t.seatLabel || "無座位")}</div>
      </div>
    `).join("");

    if (ticketsCache.length === 1) selectTicket(ticketsCache[0].id);

  }catch(e){
    console.error(e);
    searchStatus.textContent = `查詢失敗：${e.message || e}`;
  }
}

function clearSearch(){
  queryEl.value = "";
  currentTicket = null;
  ticketsCache = [];
  searchStatus.textContent = "尚未查詢";
  searchResults.innerHTML = "";
  ticketDetailCard.style.display = "none";
}

window.selectTicket = function(ticketDocId){
  const found = ticketsCache.find(t => t.id === ticketDocId);
  if (!found) return;
  currentTicket = found;
  document.querySelectorAll(".result-item").forEach(el => el.classList.remove("active"));
  const idx = ticketsCache.indexOf(found);
  document.querySelectorAll(".result-item")[idx]?.classList.add("active");
  renderTicketDetail(found);
};

function renderTicketDetail(t){
  if (!t) { ticketDetailCard.style.display = "none"; return; }
  ticketDetailCard.style.display = "";

  const ci = t.checkedIn === true || norm(t.checkinStatus).toLowerCase() === "checked_in";

  ticketDetailBody.innerHTML = `
    <div class="ticket-detail">
      <div class="ticket-kv">
        <div class="k">姓名</div>
        <div class="v ticket-highlight">${esc(t.holderName || t.name || "–")}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">學號</div>
        <div class="v ticket-highlight mono">${esc(t.studentId || t.studentCode || "–")}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">Email</div>
        <div class="v small">${esc(t.holderEmail || t.email || "–")}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">票種</div>
        <div class="v">${esc(t.ticketTypeName || "–")}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">座位</div>
        <div class="v">${esc(t.seatLabel || "無座位")}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">狀態</div>
        <div class="v">${getTicketStatusBadge(t)}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">入場時間</div>
        <div class="v small">${esc(fmtTime(t.checkedInAt))}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">入口</div>
        <div class="v">${esc(t.checkedInGate || "–")}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">出場時間</div>
        <div class="v small">${esc(fmtTime(t.checkedOutAt))}</div>
      </div>
      <div class="ticket-kv">
        <div class="k">票券 ID</div>
        <div class="v mono small">${esc(t.id || "–")}</div>
      </div>
    </div>
    <div class="ticket-actions">
      <button class="btn btn-ok" onclick="forceCheckin()">✅ 強制入場</button>
      <button class="btn btn-secondary" onclick="forceCheckout()">🚪 強制出場</button>
      <button class="btn btn-danger" onclick="resetTicket()">🔄 重設狀態</button>
    </div>
  `;
}

// ── Actions ──
async function writeServiceLog(action, ticket, extra={}){
  if (!currentSelectedAssignment || !ticket) return;
  try{
    await db.collection(`events/${currentSelectedAssignment.eventId}/serviceLogs`).add({
      action, ticketDocId:ticket.id||"", ticketId:ticket.ticketId||"",
      name:ticket.holderName||ticket.name||"", email:ticket.holderEmail||ticket.email||"",
      status:ticket.status||"", gate:ticket.checkedInGate||"",
      actorUid:currentUser?.uid||"", actorEmail:currentUser?.email||"",
      actorRoleInEvent:currentSelectedAssignment.roleInEvent||"",
      createdAt:new Date(), ...extra
    });
  }catch(e){ console.warn("log failed:",e); }
}

async function forceCheckin(){
  if (!currentTicket || !currentSelectedAssignment) return;
  const ts = getEventTimeState(currentEventData);
  if (!ts.ok) { alert(ts.reason); return; }
  if (!confirm(`確定要強制入場：${currentTicket.holderName || currentTicket.email}？`)) return;
  try{
    await db.doc(`events/${currentSelectedAssignment.eventId}/tickets/${currentTicket.id}`).update({
      status:"inside", checkedIn:true, checkinStatus:"checked_in",
      checkedInAt:new Date(), checkedOutAt:null, updatedAt:new Date(),
      checkedInGate:norm(currentSelectedAssignment.gateName||"服務中心"),
      checkedInBy:currentUser.uid, checkedInByEmail:currentUser.email||"",
      checkedInEventId:currentSelectedAssignment.eventId
    });
    await writeServiceLog("force_checkin", { ...currentTicket, checkedInGate:currentSelectedAssignment.gateName||"服務中心" });
    await searchTickets();
  }catch(e){ alert("操作失敗：" + (e.message||e)); }
}
window.forceCheckin = forceCheckin;

async function forceCheckout(){
  if (!currentTicket || !currentSelectedAssignment) return;
  const ts = getEventTimeState(currentEventData);
  if (!ts.ok) { alert(ts.reason); return; }
  if (!confirm(`確定要強制出場：${currentTicket.holderName || currentTicket.email}？`)) return;
  try{
    await db.doc(`events/${currentSelectedAssignment.eventId}/tickets/${currentTicket.id}`).update({
      status:"exited", checkedOutAt:new Date(), updatedAt:new Date()
    });
    await writeServiceLog("force_checkout", currentTicket);
    await searchTickets();
  }catch(e){ alert("操作失敗：" + (e.message||e)); }
}
window.forceCheckout = forceCheckout;

async function resetTicket(){
  if (!currentTicket || !currentSelectedAssignment) return;
  if (!confirm(`確定要重設票券狀態：${currentTicket.holderName || currentTicket.email}？此操作不可逆。`)) return;
  try{
    await db.doc(`events/${currentSelectedAssignment.eventId}/tickets/${currentTicket.id}`).update({
      status:"valid", checkedIn:false, checkinStatus:"",
      checkedInAt:null, checkedOutAt:null, checkedInGate:"",
      checkedInBy:"", checkedInByEmail:"", updatedAt:new Date()
    });
    await writeServiceLog("reset_ticket", currentTicket);
    await searchTickets();
  }catch(e){ alert("操作失敗：" + (e.message||e)); }
}
window.resetTicket = resetTicket;

// ── Scan Logs ──
function watchScanLogs(){
  if (unsubScanLogs) { unsubScanLogs(); unsubScanLogs = null; }
  if (!currentSelectedAssignment) return;

  const scanLogsDiv = document.getElementById("scanLogsDiv");
  const scanLogCount = document.getElementById("scanLogCount");

  unsubScanLogs = db.collection(`events/${currentSelectedAssignment.eventId}/scanLogs`)
    .orderBy("checkedInAt","desc").limit(50)
    .onSnapshot(snap => {
      scanLogCount.textContent = `共 ${snap.size} 筆`;
      if (snap.empty) { scanLogsDiv.innerHTML = `<div class="empty">尚未有核銷記錄</div>`; return; }

      scanLogsDiv.innerHTML = snap.docs.map(doc => {
        const d = doc.data() || {};
        const isSuccess = norm(d.result || "") === "success";
        const isWarn = norm(d.result || "") === "warn" || norm(d.result || "") === "duplicate";
        const badgeCls = isSuccess ? "badge-ok" : isWarn ? "badge-yellow" : "badge-warn";
        const badgeText = isSuccess ? "✅ 入場" : isWarn ? "⚠️ 重複" : "❌ 失敗";
        const time = fmtTime(d.checkedInAt);
        const gate = norm(d.checkedInGate || d.gate || "–");
        const email = norm(d.email || "–");
        const ticketType = norm(d.ticketTypeName || "–");
        const seat = norm(d.seatLabel || "");
        const byEmail = norm(d.checkedInByEmail || "–");
        return `<div class="log-item">
          <span class="log-action badge ${badgeCls}">${badgeText}</span>
          <div class="log-info">
            <b>${esc(email)}</b><br>
            <span class="small">${esc(ticketType)}${seat ? ` ｜ ${esc(seat)}` : ""} ｜ 入口：${esc(gate)}</span><br>
            <span class="small" style="color:#9ca3af;">驗票：${esc(byEmail)}</span>
          </div>
          <div class="log-time">${esc(time)}</div>
        </div>`;
      }).join("");
    }, err => console.warn("scanLogs error:", err));
}

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>後台｜活動詳情</title>
<style>
:root{
  --bg:#f4f5f9;--card:#fff;--text:#111827;--muted:#6b7280;
  --line:rgba(17,24,39,.08);--shadow:0 8px 24px rgba(0,0,0,.06);
  --ok:#16a34a;--ok-bg:#dcfce7;--warn:#dc2626;--warn-bg:#fee2e2;
  --blue:#2563eb;--blue-bg:#dbeafe;--yellow:#d97706;--yellow-bg:#fef3c7;
  --r:18px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);}
.wrap{max-width:1100px;margin:auto;padding:20px 16px 60px;}
.card{background:#fff;border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--line);}
.card-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.card-title{font-size:16px;font-weight:900;margin:0;}
h1{margin:0;font-size:22px;font-weight:900;}
.sub{color:var(--muted);font-size:13px;line-height:1.7;margin-top:4px;}
.small{font-size:12px;color:var(--muted);}
.mono{font-family:ui-monospace,monospace;font-size:12px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:11px;border:none;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .12s;text-decoration:none;}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-dark{background:#111827;color:#fff;}
.btn-ghost{background:#fff;color:#111827;border:1px solid #ddd;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:9px;}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:900;}
.b-ok{background:var(--ok-bg);color:var(--ok);}
.b-warn{background:var(--warn-bg);color:var(--warn);}
.b-blue{background:var(--blue-bg);color:var(--blue);}
.b-yellow{background:var(--yellow-bg);color:var(--yellow);}
.b-gray{background:#f3f4f6;color:#374151;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;}
.stat-num{font-size:26px;font-weight:900;line-height:1;}
.stat-num.ok{color:var(--ok);}
.stat-num.blue{color:var(--blue);}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:4px;}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:700px){.info-grid{grid-template-columns:1fr 1fr;}}
.info-kv .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.info-kv .v{font-size:14px;font-weight:700;margin-top:2px;}
.progress-bar{height:8px;background:#f3f4f6;border-radius:999px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:999px;background:var(--ok);transition:width .3s;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:700px){.summary-grid{grid-template-columns:1fr;}}
.summary-card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.summary-card:hover{border-color:#999;box-shadow:0 4px 14px rgba(0,0,0,.1);}
.summary-card-title{font-size:15px;font-weight:900;margin-bottom:14px;display:flex;justify-content:space-between;}
.summary-open{font-size:11px;color:var(--blue);font-weight:700;}
.summary-nums{display:flex;gap:20px;flex-wrap:wrap;}
.sn .n{font-size:26px;font-weight:900;}
.sn .l{font-size:11px;color:var(--muted);}
.person-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.person-row:last-child{border-bottom:none;}
.person-email{font-size:13px;font-weight:700;}
.person-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.gate-badge{display:inline-block;background:#f3f4f6;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;color:#374151;}
.empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
.topnav{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:100;}
.topnav-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:var(--r);width:100%;max-width:980px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.2);}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.modal-hd h2{margin:0;font-size:16px;}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px;line-height:1;}
.modal-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.modal-filter input,.modal-filter select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;outline:none;background:#fff;}
.modal-filter input{flex:1;min-width:180px;}
.modal-filter input:focus,.modal-filter select:focus{border-color:#111827;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:7px 10px;border-bottom:2px solid var(--line);font-weight:900;white-space:nowrap;color:var(--muted);font-size:11px;text-transform:uppercase;}
tbody tr{border-bottom:1px solid var(--line);transition:background .1s;}
tbody tr:hover{background:#fafafa;}
tbody td{padding:9px 10px;vertical-align:middle;}
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-inner">
    <div style="font-size:14px;font-weight:900;" id="navTitle">活動詳情</div>
    <div class="row">
      <span class="small" id="whoEl"></span>
      <a class="btn btn-ghost btn-sm" href="dashboard.html">← 返回活動總覽</a>
      <a class="btn btn-ghost btn-sm" id="manageBtn" href="#">活動管理</a>
      <a class="btn btn-dark btn-sm" id="staffAssignBtn" href="#">人員安排</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">登出</button>
    </div>
  </div>
</div>

<div id="gate" class="wrap" style="display:none;"></div>
<div id="app" class="wrap" style="display:none;">
  <div class="card" id="eventInfoCard"></div>
  <div class="card" id="statsCard" style="display:none;">
    <div class="card-hd">
      <div class="card-title">統計總覽</div>
      <div class="small" id="checkinPct"></div>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <div style="margin-top:14px;">
      <div class="small" style="font-weight:700;margin-bottom:4px;">入場進度</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="summary-grid">
    <div class="summary-card" onclick="openModal('orders')">
      <div class="summary-card-title">訂單 <span class="summary-open">查看全部 →</span></div>
      <div class="summary-nums">
        <div class="sn"><div class="n" id="sOrders">–</div><div class="l">總筆數</div></div>
        <div class="sn"><div class="n ok" id="sOrdersDone">–</div><div class="l">已完成</div></div>
        <div class="sn"><div class="n" style="color:var(--yellow);" id="sOrdersPending">–</div><div class="l">待處理</div></div>
        <div class="sn"><div class="n" style="color:var(--muted);" id="sOrdersCancelled">–</div><div class="l">已取消</div></div>
      </div>
    </div>
    <div class="summary-card" onclick="openModal('tickets')">
      <div class="summary-card-title">票券 <span class="summary-open">查看全部 →</span></div>
      <div class="summary-nums">
        <div class="sn"><div class="n" id="sTickets">–</div><div class="l">總張數</div></div>
        <div class="sn"><div class="n ok" id="sChecked">–</div><div class="l">已入場</div></div>
        <div class="sn"><div class="n blue" id="sInside">–</div><div class="l">在場中</div></div>
        <div class="sn"><div class="n" style="color:var(--muted);" id="sNot">–</div><div class="l">未入場</div></div>
      </div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div class="card">
      <div class="card-hd"><div class="card-title">活動人員</div><button class="btn btn-ghost btn-sm" id="exportStaffBtn">📥 匯出</button></div>
      <div id="staffList"><div class="empty">目前沒有活動人員資料</div></div>
    </div>
    <div class="card">
      <div class="card-hd"><div class="card-title">驗票人員</div><button class="btn btn-ghost btn-sm" id="exportCheckinBtn">📥 匯出</button></div>
      <div id="checkinList"><div class="empty">目前沒有驗票人員資料</div></div>
    </div>
  </div>
</div>

<!-- Orders Modal -->
<div class="modal-overlay" id="ordersModal">
  <div class="modal">
    <div class="modal-hd">
      <h2>訂單列表</h2>
      <div class="row">
        <button class="btn btn-ghost btn-sm" id="exportOrdersBtn">📥 匯出 CSV</button>
        <button class="modal-close" onclick="closeModal('orders')">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-filter">
        <input type="text" id="orderSearch" placeholder="搜尋 Email / 姓名 / 訂單 ID…"/>
        <select id="orderStatusFilter">
          <option value="">全部狀態</option>
          <option value="registered">已報名</option>
          <option value="ready_for_checkout">待完成</option>
          <option value="pending_payment">待付款</option>
          <option value="paid">已付款</option>
          <option value="completed">已完成</option>
          <option value="cancelled">已取消</option>
          <option value="expired">已過期</option>
        </select>
        <span class="small" id="orderCountText"></span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>姓名</th><th>Email</th><th>票種</th><th>張數</th><th>金額</th><th>訂單狀態</th><th>付款</th><th>座位</th><th>學號</th><th>公關代碼</th><th>建立時間</th><th>訂單 ID</th></tr></thead>
          <tbody id="ordersTbody"></tbody>
        </table>
      </div>
      <div id="ordersEmpty" class="empty" style="display:none;"></div>
      <div id="ordersMore" style="text-align:center;padding:12px;display:none;"><button class="btn btn-ghost btn-sm" id="ordersMoreBtn">載入更多</button></div>
    </div>
  </div>
</div>

<!-- Tickets Modal -->
<div class="modal-overlay" id="ticketsModal">
  <div class="modal">
    <div class="modal-hd">
      <h2>票券列表</h2>
      <div class="row">
        <button class="btn btn-ghost btn-sm" id="exportTicketsBtn">📥 匯出 CSV</button>
        <button class="modal-close" onclick="closeModal('tickets')">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-filter">
        <input type="text" id="ticketSearch" placeholder="搜尋姓名 / Email / 學號 / 座位…"/>
        <select id="ticketStatusFilter">
          <option value="">全部狀態</option>
          <option value="checked">已入場</option>
          <option value="unchecked">未入場</option>
        </select>
        <span class="small" id="ticketCountText"></span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>持票人姓名</th><th>學號</th><th>Email</th><th>票種</th><th>座位</th><th>入場狀態</th><th>入場時間</th><th>入口</th><th>出場時間</th><th>訂單 ID</th></tr></thead>
          <tbody id="ticketsTbody"></tbody>
        </table>
      </div>
      <div id="ticketsEmpty" class="empty" style="display:none;"></div>
      <div id="ticketsMore" style="text-align:center;padding:12px;display:none;"><button class="btn btn-ghost btn-sm" id="ticketsMoreBtn">載入更多</button></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
if(!firebase.apps.length){firebase.initializeApp({apiKey:"AIzaSyDtF2pHo84vy2n_dJAkCisopllaLAWjaj0",authDomain:"concert-1ff7e.firebaseapp.com",projectId:"concert-1ff7e"});}
const db=firebase.firestore(),auth=firebase.auth();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const norm=s=>String(s??'').trim();
const url=new URL(location.href);
const eventId=(url.searchParams.get("eventId")||url.searchParams.get("id")||"").trim();
let currentUser=null,currentRole="",currentUserData={};
let allOrders=[],allTickets=[],allStaff=[],allCheckin=[];
let ordersPage=0,ticketsPage=0;
const PAGE=80;

function toMs(ts){if(!ts)return 0;if(ts.toDate)return ts.toDate().getTime();if(ts instanceof Date)return ts.getTime();return new Date(ts).getTime();}
function fmt(ts){if(!ts)return"–";const d=ts.toDate?ts.toDate():new Date(ts);return isNaN(d)?'–':d.toLocaleString("zh-TW",{timeZone:"Asia/Taipei"});}
function fmtMoney(n){return n>0?`NT$${Number(n).toLocaleString()}`:"免費";}
function csvCell(v){return`"${String(v??'').replace(/"/g,'""')}"}`;}
function dlCsv(rows,fname){
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=fname;a.style.display="none";
  document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},300);
}
function isCheckedIn(t){return t.checkedIn===true||norm(t.checkinStatus).toLowerCase()==="checked_in";}
function getOrderBadge(s){
  const m={registered:["b-blue","已報名"],ready_for_checkout:["b-blue","待完成"],pending_payment:["b-yellow","待付款"],paid:["b-ok","已付款"],completed:["b-ok","已完成"],cancelled:["b-warn","已取消"],expired:["b-warn","已過期"]};
  const[cls,text]=m[s]||["b-gray",s||"–"];
  return`<span class="badge ${cls}">${esc(text)}</span>`;
}
function getTicketBadge(t){
  const s=norm(t.status||""),ci=isCheckedIn(t);
  if(s==="inside")return`<span class="badge b-blue">在場中</span>`;
  if(s==="exited")return`<span class="badge b-gray">已出場</span>`;
  if(ci)return`<span class="badge b-ok">✓ 已入場</span>`;
  return`<span class="badge b-yellow">未入場</span>`;
}
function showGate(title,text){
  document.getElementById("gate").style.display="";
  document.getElementById("app").style.display="none";
  document.getElementById("gate").innerHTML=`<div class="card"><div style="font-size:20px;font-weight:900;margin-bottom:8px;">${esc(title)}</div><div class="sub">${esc(text)}</div></div>`;
}
function isAllowedRole(r){return["platform_super","platform_admin","org_super","org_admin","org_staff"].includes(r);}
function canManageEvent(event){
  if(["platform_super","platform_admin"].includes(currentRole))return true;
  const s=norm(currentUserData?.schoolId||"");
  return norm(event.ownerSchoolId||event.creatorSchoolId||"")==s;
}
function getStatus(event){
  const now=Date.now(),s=toMs(event.eventStartAt),e=toMs(event.eventEndAt);
  if(e&&now>e)return{text:"已結束",cls:"b-warn"};
  if(s&&now>=s)return{text:"進行中",cls:"b-ok"};
  return{text:"尚未開始",cls:"b-blue"};
}

// Modal
window.openModal=function(type){
  document.getElementById(type+"sModal").classList.add("open");
  if(type==="orders")renderOrdersTable();
  if(type==="tickets")renderTicketsTable();
};
window.closeModal=function(type){document.getElementById(type+"sModal").classList.remove("open");};
document.querySelectorAll(".modal-overlay").forEach(el=>el.onclick=e=>{if(e.target===el)el.classList.remove("open");});

async function loadEventPage(){
  if(!eventId){showGate("錯誤","缺少活動 ID。");return;}
  document.getElementById("manageBtn").href=`admin-events.html?eventId=${encodeURIComponent(eventId)}`;
  document.getElementById("staffAssignBtn").href=`admin-staff-assign.html?eventId=${encodeURIComponent(eventId)}`;
  const eventSnap=await db.doc(`events/${eventId}`).get();
  if(!eventSnap.exists){showGate("找不到活動","此活動不存在。");return;}
  const event=eventSnap.data()||{};
  if(!canManageEvent(event)){showGate("權限不足","你沒有權限查看這場活動。");return;}
  renderEventInfo(event);
  const[oSnap,tSnap,sSnap,cSnap]=await Promise.all([
    db.collection(`events/${eventId}/orders`).get(),
    db.collection(`events/${eventId}/tickets`).get(),
    db.collection(`events/${eventId}/staffAssignments`).get(),
    db.collection(`events/${eventId}/checkinAssignments`).get()
  ]);
  allOrders=oSnap.docs.map(d=>({id:d.id,...(d.data()||{})})).sort((a,b)=>toMs(b.createdAt)-toMs(a.createdAt));
  allTickets=tSnap.docs.map(d=>({id:d.id,...(d.data()||{})})).sort((a,b)=>{const ac=isCheckedIn(a)?0:1,bc=isCheckedIn(b)?0:1;return ac!==bc?ac-bc:toMs(b.checkedInAt)-toMs(a.checkedInAt);});
  allStaff=sSnap.docs.map(d=>({id:d.id,...(d.data()||{})}));
  allCheckin=cSnap.docs.map(d=>({id:d.id,...(d.data()||{})}));
  renderStats(event);renderSummaryCards();renderStaffLists();
}

function renderEventInfo(event){
  const s=getStatus(event);
  const tts=Array.isArray(event.ticketTypes)?event.ticketTypes:[];
  document.getElementById("navTitle").textContent=norm(event.title||"活動詳情");
  document.getElementById("eventInfoCard").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
      <div><h1>${esc(event.title||"未命名活動")}</h1>
      <div class="row" style="margin-top:10px;">
        <span class="badge ${s.cls}">${s.text}</span>
        ${event.published?`<span class="badge b-ok">已發布</span>`:`<span class="badge b-warn">未公開</span>`}
        ${norm(event.approvalStatus)==="approved"?`<span class="badge b-ok">已審核</span>`:`<span class="badge b-yellow">審核中</span>`}
      </div></div>
    </div>
    <div class="info-grid">
      <div class="info-kv"><div class="k">地點</div><div class="v">${esc(event.location||"–")}</div></div>
      <div class="info-kv"><div class="k">活動時間</div><div class="v" style="font-size:12px;">${esc(fmt(event.eventStartAt))} ～ ${esc(fmt(event.eventEndAt))}</div></div>
      <div class="info-kv"><div class="k">受理時間</div><div class="v" style="font-size:12px;">${esc(fmt(event.saleStartAt))} ～ ${esc(fmt(event.saleEndAt))}</div></div>
      <div class="info-kv"><div class="k">名額</div><div class="v">${esc(String(event.capacity??'–'))}</div></div>
      <div class="info-kv"><div class="k">入口數量</div><div class="v">${Array.isArray(event.gates)?event.gates.length:0}</div></div>
      <div class="info-kv"><div class="k">票種數</div><div class="v">${tts.length}</div></div>
    </div>
    ${tts.length?`<div class="divider"></div><div class="row">${tts.map(t=>`<span class="badge b-gray">${esc(t.name||t.id)} ${t.price>0?`NT$${t.price}`:"免費"}</span>`).join("")}</div>`:``}
    ${event.description?`<div class="divider"></div><div class="sub">${esc(event.description).replace(/\n/g,"<br>")}</div>`:""}
  `;
  document.getElementById("statsCard").style.display="";
}

function renderStats(event){
  const checked=allTickets.filter(isCheckedIn).length;
  const inside=allTickets.filter(t=>t.status==="inside").length;
  const valid=allOrders.filter(o=>!["cancelled","expired","failed"].includes(norm(o.status)));
  const totalAmount=allOrders.reduce((s,o)=>s+Number(o.totalAmount||o.total||0),0);
  const nonCheckin=allStaff.filter(s=>norm(s.roleInEvent)!=="checkin"&&!s?.permissions?.canCheckin);
  const pct=allTickets.length?Math.round(checked/allTickets.length*100):0;
  document.getElementById("statsGrid").innerHTML=`
    <div class="stat-box"><div class="stat-num">${valid.length} <span style="font-size:13px;color:var(--muted)">/ ${allOrders.length}</span></div><div class="stat-lbl">有效訂單</div></div>
    <div class="stat-box"><div class="stat-num ok">${checked}</div><div class="stat-lbl">已入場</div></div>
    <div class="stat-box"><div class="stat-num blue">${inside}</div><div class="stat-lbl">在場中</div></div>
    <div class="stat-box"><div class="stat-num">${allTickets.length-checked}</div><div class="stat-lbl">未入場</div></div>
    <div class="stat-box"><div class="stat-num">${allTickets.length}</div><div class="stat-lbl">票券總數</div></div>
    <div class="stat-box"><div class="stat-num">${nonCheckin.length}</div><div class="stat-lbl">活動人員</div></div>
    <div class="stat-box"><div class="stat-num">${allCheckin.length}</div><div class="stat-lbl">驗票人員</div></div>
    <div class="stat-box"><div class="stat-num">${fmtMoney(totalAmount)}</div><div class="stat-lbl">訂單總額</div></div>
  `;
  document.getElementById("checkinPct").textContent=`${checked} / ${allTickets.length}（${pct}%）`;
  document.getElementById("progressFill").style.width=`${pct}%`;
}

function renderSummaryCards(){
  const done=allOrders.filter(o=>["paid","completed","registered","ready_for_checkout"].includes(norm(o.status))).length;
  const pending=allOrders.filter(o=>["pending_payment"].includes(norm(o.status))).length;
  const cancelled=allOrders.filter(o=>["cancelled","expired"].includes(norm(o.status))).length;
  document.getElementById("sOrders").textContent=allOrders.length;
  document.getElementById("sOrdersDone").textContent=done;
  document.getElementById("sOrdersPending").textContent=pending;
  document.getElementById("sOrdersCancelled").textContent=cancelled;
  const checked=allTickets.filter(isCheckedIn).length;
  const inside=allTickets.filter(t=>t.status==="inside").length;
  document.getElementById("sTickets").textContent=allTickets.length;
  document.getElementById("sChecked").textContent=checked;
  document.getElementById("sInside").textContent=inside;
  document.getElementById("sNot").textContent=allTickets.length-checked;
}

function renderStaffLists(){
  const nonCheckin=allStaff.filter(s=>norm(s.roleInEvent)!=="checkin"&&!s?.permissions?.canCheckin);
  document.getElementById("staffList").innerHTML=nonCheckin.length
    ?nonCheckin.map(s=>`<div class="person-row"><div><div class="person-email">${esc(s.email||s.id||"–")}</div><div class="person-meta">職位：${esc(s.roleInEvent||"活動人員")} ｜ 分組：${esc(s.groupName||"–")}</div></div><span class="badge b-blue">${esc(s.roleInEvent||"–")}</span></div>`).join("")
    :`<div class="empty">目前沒有活動人員資料</div>`;
  document.getElementById("checkinList").innerHTML=allCheckin.length
    ?allCheckin.map(c=>`<div class="person-row"><div><div class="person-email">${esc(c.email||c.id||"–")}</div><div class="person-meta">入口：${esc(c.gateName||"未指定")} ｜ 分組：${esc(c.groupName||"–")}</div></div><span class="gate-badge">${esc(c.gateName||"未指定入口")}</span></div>`).join("")
    :`<div class="empty">目前沒有驗票人員資料</div>`;
}

// Orders Modal
function getFilteredOrders(){
  const q=(document.getElementById("orderSearch").value||"").toLowerCase();
  const st=document.getElementById("orderStatusFilter").value;
  return allOrders.filter(o=>{
    if(st&&norm(o.status)!==st)return false;
    if(!q)return true;
    return(o.buyerEmail||o.email||"").toLowerCase().includes(q)||(o.holderName||o.name||"").toLowerCase().includes(q)||o.id.toLowerCase().includes(q);
  });
}
function renderOrderRow(o){
  const seats=Array.isArray(o.seatLabels)?o.seatLabels.join("、"):(o.seatLabel||"");
  return`<tr>
    <td style="font-weight:700;">${esc(o.holderName||o.name||"–")}</td>
    <td style="font-size:12px;">${esc(o.buyerEmail||o.email||"–")}</td>
    <td style="font-size:12px;">${esc(o.ticketTypeName||"–")}</td>
    <td style="text-align:center;">${esc(String(o.totalQuantity||o.quantity||"–"))}</td>
    <td>${fmtMoney(o.totalAmount||o.total||0)}</td>
    <td>${getOrderBadge(o.status)}</td>
    <td><span class="badge ${o.paymentStatus==="paid"?"b-ok":"b-gray"}">${esc(o.paymentStatus||"–")}</span></td>
    <td style="font-size:12px;">${esc(seats||"–")}</td>
    <td class="mono">${esc(o.studentId||o.studentCode||"–")}</td>
    <td class="mono">${esc(o.promoCode||o.inviteCode||"–")}</td>
    <td style="font-size:11px;white-space:nowrap;">${fmt(o.createdAt)}</td>
    <td class="mono" style="font-size:10px;color:var(--muted);">${esc(o.id)}</td>
  </tr>`;
}
function renderOrdersTable(){
  const filtered=getFilteredOrders();ordersPage=0;
  document.getElementById("orderCountText").textContent=`共 ${filtered.length} 筆`;
  const tbody=document.getElementById("ordersTbody"),empty=document.getElementById("ordersEmpty"),more=document.getElementById("ordersMore");
  if(!filtered.length){tbody.innerHTML="";empty.style.display="";empty.textContent="找不到符合的訂單";more.style.display="none";return;}
  empty.style.display="none";
  tbody.innerHTML=filtered.slice(0,PAGE).map(renderOrderRow).join("");
  more.style.display=filtered.length>PAGE?"":"none";ordersPage=1;
}
document.getElementById("orderSearch").oninput=renderOrdersTable;
document.getElementById("orderStatusFilter").onchange=renderOrdersTable;
document.getElementById("ordersMoreBtn").onclick=()=>{
  const f=getFilteredOrders();
  document.getElementById("ordersTbody").innerHTML+=f.slice(ordersPage*PAGE,(ordersPage+1)*PAGE).map(renderOrderRow).join("");
  ordersPage++;if(ordersPage*PAGE>=f.length)document.getElementById("ordersMore").style.display="none";
};
document.getElementById("exportOrdersBtn").onclick=()=>{
  const d=getFilteredOrders();
  const h=["訂單ID","姓名","Email","票種","張數","金額","訂單狀態","付款狀態","座位","學號","公關代碼","建立時間"];
  dlCsv([h,...d.map(o=>[o.id,o.holderName||o.name||"",o.buyerEmail||o.email||"",o.ticketTypeName||"",o.totalQuantity||o.quantity||"",o.totalAmount||o.total||0,o.status||"",o.paymentStatus||"",Array.isArray(o.seatLabels)?o.seatLabels.join("、"):(o.seatLabel||""),o.studentId||o.studentCode||"",o.promoCode||o.inviteCode||"",fmt(o.createdAt)])],`orders_${eventId}_${new Date().toISOString().slice(0,10)}.csv`);
};

// Tickets Modal
function getFilteredTickets(){
  const q=(document.getElementById("ticketSearch").value||"").toLowerCase();
  const st=document.getElementById("ticketStatusFilter").value;
  return allTickets.filter(t=>{
    const ci=isCheckedIn(t);
    if(st==="checked"&&!ci)return false;
    if(st==="unchecked"&&ci)return false;
    if(!q)return true;
    return(t.holderName||t.name||"").toLowerCase().includes(q)||(t.holderEmail||t.email||"").toLowerCase().includes(q)||(t.studentId||t.studentCode||"").toLowerCase().includes(q)||(t.seatLabel||"").toLowerCase().includes(q);
  });
}
function renderTicketRow(t){
  const ci=isCheckedIn(t);
  return`<tr>
    <td style="font-weight:700;">${esc(t.holderName||t.name||"–")}</td>
    <td class="mono">${esc(t.studentId||t.studentCode||"–")}</td>
    <td style="font-size:12px;">${esc(t.holderEmail||t.email||"–")}</td>
    <td style="font-size:12px;">${esc(t.ticketTypeName||"–")}</td>
    <td style="font-size:12px;">${esc(t.seatLabel||"–")}</td>
    <td>${getTicketBadge(t)}</td>
    <td style="font-size:11px;white-space:nowrap;">${ci?fmt(t.checkedInAt):"–"}</td>
    <td>${ci&&t.checkedInGate?`<span class="gate-badge">${esc(t.checkedInGate)}</span>`:"–"}</td>
    <td style="font-size:11px;white-space:nowrap;">${t.checkedOutAt?fmt(t.checkedOutAt):"–"}</td>
    <td class="mono" style="font-size:10px;color:var(--muted);">${esc(t.orderId||"–")}</td>
  </tr>`;
}
function renderTicketsTable(){
  const filtered=getFilteredTickets();ticketsPage=0;
  document.getElementById("ticketCountText").textContent=`共 ${filtered.length} 張`;
  const tbody=document.getElementById("ticketsTbody"),empty=document.getElementById("ticketsEmpty"),more=document.getElementById("ticketsMore");
  if(!filtered.length){tbody.innerHTML="";empty.style.display="";empty.textContent="找不到符合的票券";more.style.display="none";return;}
  empty.style.display="none";
  tbody.innerHTML=filtered.slice(0,PAGE).map(renderTicketRow).join("");
  more.style.display=filtered.length>PAGE?"":"none";ticketsPage=1;
}
document.getElementById("ticketSearch").oninput=renderTicketsTable;
document.getElementById("ticketStatusFilter").onchange=renderTicketsTable;
document.getElementById("ticketsMoreBtn").onclick=()=>{
  const f=getFilteredTickets();
  document.getElementById("ticketsTbody").innerHTML+=f.slice(ticketsPage*PAGE,(ticketsPage+1)*PAGE).map(renderTicketRow).join("");
  ticketsPage++;if(ticketsPage*PAGE>=f.length)document.getElementById("ticketsMore").style.display="none";
};
document.getElementById("exportTicketsBtn").onclick=()=>{
  const d=getFilteredTickets();
  const h=["持票人姓名","學號","Email","票種","座位","入場狀態","入場時間","入口","出場時間","訂單ID"];
  dlCsv([h,...d.map(t=>{const ci=isCheckedIn(t);const s=t.status==="inside"?"在場中":t.status==="exited"?"已出場":ci?"已入場":"未入場";return[t.holderName||t.name||"",t.studentId||t.studentCode||"",t.holderEmail||t.email||"",t.ticketTypeName||"",t.seatLabel||"",s,ci?fmt(t.checkedInAt):"",ci?(t.checkedInGate||""):"",t.checkedOutAt?fmt(t.checkedOutAt):"",t.orderId||""];})],`tickets_${eventId}_${new Date().toISOString().slice(0,10)}.csv`);
};

// Staff export
document.getElementById("exportStaffBtn").onclick=()=>{
  const d=allStaff.filter(s=>norm(s.roleInEvent)!=="checkin"&&!s?.permissions?.canCheckin);
  dlCsv([["Email","職位","分組","備註"],...d.map(s=>[s.email||s.id||"",s.roleInEvent||"",s.groupName||"",s.note||""])],`staff_${eventId}.csv`);
};
document.getElementById("exportCheckinBtn").onclick=()=>{
  dlCsv([["Email","入口","分組","身分"],...allCheckin.map(c=>[c.email||c.id||"",c.gateName||"",c.groupName||"",c.role||""])],`checkin_${eventId}.csv`);
};

// Auth
document.getElementById("logoutBtn").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async user=>{
  currentUser=user||null;
  if(!user){showGate("活動詳情","請先登入後台帳號。");return;}
  try{
    const usnap=await db.doc(`users/${user.uid}`).get();
    const udata=usnap.data()||{};
    currentRole=norm(udata.role||"");currentUserData=udata;
    if(!isAllowedRole(currentRole)){showGate("權限不足","你沒有權限查看此頁面。");return;}
    document.getElementById("whoEl").textContent=`${user.email} | ${currentRole}`;
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    await loadEventPage();
  }catch(e){console.error(e);showGate("發生錯誤","無法讀取資料，請稍後再試。");}
});
</script>
</body>
</html>
